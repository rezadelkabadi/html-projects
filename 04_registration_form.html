<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت نام</title>
</head>
<body>
    <h1>فرم ثبت نام</h1>
    <form action="/submit-form" method="post">
        <p>
            <label for="firstname">نام:</label>
            <input type="text" name="firstname" id="firstname" required>
        </p>
        <p>
            <label for="lastname">نام خانوادگی:</label>
            <input type="text" name="lastname" id="lastname" required>
        </p>
        <p>
            <label for="email">ایمیل:</label>
            <input type="email" name="email" id="email" required>
        </p>
        <p>
            <label for="age">سن:</label>
            <input type="number" name="age" id="age" required min="1" max="120">
        </p>
        <p>
            <span>جنسیت:</span><br>
            <input type="radio" name="gender" id="male" value="male" required>
            <label for="male">مرد</label><br>
            <input type="radio" name="gender" id="female" value="female" required>
            <label for="female">زن</label>
        </p>
        <p>
            <label for="country">کشور:</label>
            <select name="country" id="country" required>
                <option value="">--انتخاب کنید--</option>
                <option value="iran">ایران</option>
                <option value="canada">کانادا</option>
                <option value="turkey">ترکیه</option>
            </select>
        </p>
        <p>
            <label for="bio">توضیحات:</label><br>
            <textarea name="bio" id="bio" rows="3" cols="50"></textarea>
        </p>
        <p>
            <input type="checkbox" name="terms" id="terms" required>
            <label for="terms">قوانین را مطالعه و میپذیرم</label>
        </p>
        <p>
            <input type="submit" value="ثبت نام">
        </p>
    </form>
</body>
</html>
