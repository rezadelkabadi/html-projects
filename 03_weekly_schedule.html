<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه هفتگی</title>

            padding: 10px;

        }

            font-size: 1.5em;
            margin-bottom: 10px;

</head>

            </tr>
            <tr>

            </tr>
            <tr>
                <td>۱۱-۱۲</td>
                <td>استراحت</td>
                <td>حل تمرین</td>
                <td>حل تمرین</td>
                <td>تماشای ویدیو</td>
                <td>حل تمرین</td>
                <td>پروژه</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
